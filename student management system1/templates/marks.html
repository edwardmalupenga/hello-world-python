<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS - Marks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">SMS</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4">Marks & Grades</h1>
        
        <div class="card mb-4">
            <div class="card-header">
                <h5>Add Mark</h5>
            </div>
            <div class="card-body">
                <form method="post" action="{{ url_for('add_mark') }}">
                    <div class="row">
                        <div class="col-md-3">
                            <select class="form-control" name="student_id" required>
                                <option value="">Select Student</option>
                                {% for student in students %}
                                <option value="{{ student.student_id }}">{{ student.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-control" name="subject_id" required>
                                <option value="">Select Subject</option>
                                {% for subject in subjects %}
                                <option value="{{ subject.id }}">{{ subject.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input type="text" class="form-control" name="term" placeholder="Term" required>
                        </div>
                        <div class="col-md-2">
                            <input type="number" class="form-control" name="mark" placeholder="Mark" min="0" max="100" required>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary">Add</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Subject</th>
                    <th>Term</th>
                    <th>Mark</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody>
                {% for mark in marks %}
                <tr>
                    <td>{{ mark.student_name }}</td>
                    <td>{{ mark.subject_name }}</td>
                    <td>{{ mark.term }}</td>
                    <td>{{ mark.mark }}</td>
                    <td>{{ mark.grade }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
