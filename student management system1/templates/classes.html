<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS - Classes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">SMS</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('students') }}">Students</a>
                <a class="nav-link" href="{{ url_for('marks') }}">Marks</a>
                <a class="nav-link" href="{{ url_for('reports') }}">Reports</a>
                <a class="nav-link" href="{{ url_for('subjects') }}">Subjects</a>
                <a class="nav-link" href="{{ url_for('classes') }}">Classes</a>
                {% if session.role == 'admin' %}
                <a class="nav-link" href="{{ url_for('users') }}">Users</a>
                {% endif %}
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Classes</h1>
            <a href="{{ url_for('add_class') }}" class="btn btn-primary">Add Class</a>
        </div>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                </tr>
            </thead>
            <tbody>
                {% for cls in classes %}
                <tr>
                    <td>{{ cls.id }}</td>
                    <td>{{ cls.name }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
